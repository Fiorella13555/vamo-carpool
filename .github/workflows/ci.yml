name: Validar Vamo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-build-check
          VITE_GOOGLE_MAPS_API_KEY: maps-build-check
      - run: npm run lint
  academic-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: recommendation-service/requirements-runtime.txt
      - run: pip install -r recommendation-service/requirements-runtime.txt pytest httpx
      - run: python -m pytest tests -q
        working-directory: recommendation-service
